name: Android CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Recreate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, relying on default key generation if any."
          fi

      - name: Setup Environment File
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Recreate Gradle Wrapper (Fix corruption)
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build and Copy APK
        run: ./gradlew copyApk

      - name: Upload Built APK
        uses: actions/upload-artifact@v4
        with:
          name: grixchat-apk
          path: grixchat.apk
